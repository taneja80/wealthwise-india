name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check -- --pretty false

      # TODO: remove continue-on-error once the pre-existing lint debt
      # (no-explicit-any, react-refresh, unused vars) is worked down.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test -- --run
