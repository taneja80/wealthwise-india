services:
  - type: web
    name: wealthwise-india
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build && npx drizzle-kit push --force
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: wealthwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Ollama LLM (set if using remote Ollama instance)
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
    healthCheckPath: /api/ping

databases:
  - name: wealthwise-db
    plan: free
    region: oregon
    ipAllowList: []
