services:
  - type: web
    name: wealthwise-india
    runtime: node
    plan: free
    region: oregon
    # Schema sync runs at startup (not build): on a first blueprint deploy the
    # database is often still provisioning while the build runs, and the
    # database is always reachable by the time the service boots.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx drizzle-kit push --force --verbose && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: wealthwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Ollama LLM (set if using remote Ollama instance)
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
    healthCheckPath: /api/ping

databases:
  - name: wealthwise-db
    plan: free
    region: oregon
    ipAllowList: []
